<!doctype html>
<!-- Full-screen video for the Half-Life 2: Alone port (cl_video.lua).
     video.html?v=<file in videos/>&vol=<0-1>. Reports back through console.log. -->
<html>
<head>
<meta charset="utf-8">
<style>
	html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
	video { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<script>
	var q = new URLSearchParams( location.search );
	var v = document.getElementById( "v" );
	var finished = false;
	function finish( why ) {
		if ( finished ) return;
		finished = true;
		console.log( "HL2A:" + why );
	}
	v.volume = Math.max( 0, Math.min( 1, parseFloat( q.get( "vol" ) || "1" ) ) );
	v.addEventListener( "playing", function () { console.log( "HL2A:started" ); } );
	v.addEventListener( "ended", function () { finish( "done" ); } );
	v.addEventListener( "error", function () { finish( "failed" ); } );
	document.addEventListener( "keydown", function ( e ) {
		if ( e.keyCode == 27 || e.keyCode == 32 || e.keyCode == 13 ) finish( "skipped" );
	} );
	document.addEventListener( "mousedown", function () { finish( "skipped" ); } );
	v.src = "videos/" + q.get( "v" );
</script>
</body>
</html>
